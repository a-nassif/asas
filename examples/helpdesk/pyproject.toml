[project]
name = "helpdesk"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "sqlmodel>=0.0.16",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2",
    "asas-ratelimit @ git+https://github.com/wlootah-a11y/asas.git@asas-ratelimit/v0.11.0#subdirectory=packages/asas-ratelimit",
    "asas-validation @ git+https://github.com/wlootah-a11y/asas.git@asas-validation/v0.11.0#subdirectory=packages/asas-validation",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx2>=0.1",
]

# Flat main.py + settings.py, not a package — without this, setuptools'
# auto-discovery sees two top-level modules and refuses to guess which one
# is "the" package, and `pip install -e .` fails outright.
[tool.setuptools]
py-modules = ["main", "settings", "models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
