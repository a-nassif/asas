[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asas-storage"
version = "0.10.0"
description = "Asas storage module: a pluggable file/object storage seam with on-disk and S3-compatible backends behind one traversal-safe contract."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
dependencies = []

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
dev = [
    "pytest>=8",
    "moto[s3]>=5.0",
    "boto3>=1.34",
]

[tool.hatch.build.targets.wheel]
packages = ["src/asas_storage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
