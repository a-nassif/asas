[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asas-workflow"
version = "0.8.0"
description = "Asas workflow module: a graph-based process/approval engine — versioned code-registered definitions, per-activation node executions, quorum approvals with request-info and delegation, condition-driven transitions, and a package-owned Alembic chain."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
dependencies = [
    "sqlmodel>=0.0.21",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "psycopg2-binary>=2.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/asas_workflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
